[project]
name = "peekaboolean"
version = "0.2.0"
description = "Typed visual questions (choice, score, yes/no) answered by scoring caller-supplied options with a small VLM"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Michael Bykovski" }]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.0",
    "datasets>=5.0.1",
    "peft==0.21.0",
    "pillow>=10",
    # macOS runs 2.14: its Metal prefill attention (added in 2.13) serves request6 22%
    # faster on an M1 Max with fp16 answers unchanged. The cu128 index below stops at 2.11.
    "torch==2.11.0; sys_platform != 'darwin'",
    "torch==2.14.0; sys_platform == 'darwin'",
    "torchvision==0.26.0; sys_platform != 'darwin'",
    "torchvision==0.29.0; sys_platform == 'darwin'",
    "transformers==5.17.0",
]

[project.scripts]
peekaboolean-train = "peekaboolean.train:main"
peekaboolean-train-general = "peekaboolean.train_general:main"
peekaboolean-prepare-general = "peekaboolean.prepare_general:main"
peekaboolean-background = "peekaboolean.background:main"
peekaboolean-benchmark = "peekaboolean.benchmark:main"
peekaboolean-calibrate = "peekaboolean.calibrate:main"
peekaboolean-prepare-ava = "peekaboolean.prepare_ava:main"
peekaboolean-prepare-aadb = "peekaboolean.prepare_aadb:main"
peekaboolean-prepare-mix = "peekaboolean.prepare_mix:main"
peekaboolean-prepare-derived = "peekaboolean.prepare_derived:main"
peekaboolean-robustness = "peekaboolean.robustness:main"
peekaboolean-serve = "peekaboolean.serve:main"
peekaboolean-ui = "peekaboolean.ui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Blackwell (sm_120) has no kernels in the default PyPI wheels, so the CUDA-linked
# packages — torch and torchvision, which must be built against the same CUDA — are
# pulled from PyTorch's cu128 index. Bump the URL, not the pins, to move to a newer
# CUDA. The index is `explicit`, so everything else still resolves from PyPI; bind a
# new package to it here in [tool.uv.sources] rather than passing `--index` on the
# uv command line, which lets the mirror serve unrelated packages too.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
