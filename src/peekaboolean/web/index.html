<style>
:root {
  --ground: oklch(0.93 0.008 165);
  --panel: oklch(0.965 0.005 165);
  --label: oklch(0.995 0 0);
  --frame: oklch(0.33 0.045 170);
  --frame-2: oklch(0.40 0.05 170);
  --frame-ink: oklch(0.95 0.01 165);
  --frame-ink-2: oklch(0.80 0.02 165);
  --ink: oklch(0.22 0.015 170);
  --ink-2: oklch(0.45 0.015 170);
  --rule: oklch(0.80 0.012 165);
  --live: oklch(0.58 0.2 28);
  --live-ink: oklch(0.99 0 0);
  --error: oklch(0.45 0.15 25);
  --radius: 3px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: oklch(0.19 0.012 170); --panel: oklch(0.225 0.012 170); --label: oklch(0.27 0.014 170);
    --frame: oklch(0.30 0.04 170); --frame-2: oklch(0.36 0.045 170);
    --frame-ink: oklch(0.95 0.01 165); --frame-ink-2: oklch(0.78 0.02 165);
    --ink: oklch(0.93 0.008 165); --ink-2: oklch(0.72 0.012 165); --rule: oklch(0.36 0.015 170);
    --live: oklch(0.66 0.19 30); --live-ink: oklch(0.16 0.01 30); --error: oklch(0.75 0.14 30);
  }
}
@font-face { font-family: Archivo; src: url(/archivo.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }

*, *::before, *::after { box-sizing: border-box; }
* { scrollbar-width: thin; }
[hidden] { display: none !important; }
html { color-scheme: light dark; accent-color: var(--frame); scrollbar-color: var(--rule) transparent; }
body {
  margin: 0; height: 100dvh; display: grid; grid-template-rows: auto 1fr;
  background: var(--ground); color: var(--ink);
  font: 400 15px/1.5 Archivo, system-ui, sans-serif; font-stretch: 100%;
  font-variant-numeric: tabular-nums; caret-color: var(--live);
}
::selection { background: color-mix(in oklch, var(--live) 28%, transparent); }
:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
h1, h2, h3, p, ol { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }
::placeholder { color: var(--ink-2); opacity: 1; }

.plate, .btn, .lbl, .seg label, .seg button, .sortby, .q-name, .bin-name, .count, .tray-head, .manifest thead th, .ans {
  font-stretch: 68%; font-weight: 650; text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.75rem;
}
.plate { display: inline-block; padding: 2px 8px; background: var(--label); color: var(--ink); border: 1px solid var(--rule); border-radius: 2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 36px; padding: 0 12px; border: 1px solid transparent; border-radius: var(--radius);
  background: none; white-space: nowrap; cursor: pointer;
  transition: background-color 150ms var(--ease), color 150ms var(--ease);
}
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.primary { background: var(--live); color: var(--live-ink); }
.primary:hover:not(:disabled) { background: color-mix(in oklab, var(--live), var(--ink) 14%); }
.secondary { background: var(--label); color: var(--ink); border-color: var(--rule); }
.secondary:hover:not(:disabled) { background: color-mix(in oklab, var(--label), var(--ink) 6%); }
.ghost { color: var(--frame-ink); }
.ghost:hover:not(:disabled) { background: var(--frame-2); }
.icon-btn { width: 28px; height: 28px; padding: 0; }
kbd { font: inherit; line-height: 16px; padding: 0 4px; border: 1px solid color-mix(in oklch, var(--live-ink) 45%, transparent); border-radius: 2px; }

.gauge {
  display: block; position: relative; height: 6px;
  background: repeating-linear-gradient(to right, var(--rule) 0 1px, transparent 1px 10%);
  border-bottom: 1px solid var(--rule); border-right: 1px solid var(--rule);
}
.gauge::before { content: ""; position: absolute; inset: 0 auto 0 0; width: calc(var(--p, 0) * 100%); background: var(--ink-2); }
.gauge.win::before { background: var(--ink); }
.gauge.marker::before { width: 2px; left: clamp(0px, calc(var(--p, 0) * 100% - 1px), calc(100% - 2px)); background: var(--ink); }

.bar { display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 0 16px; background: var(--frame); color: var(--frame-ink); }
.wordmark { display: flex; align-items: center; gap: 8px; margin-right: 8px; font-size: 1.35rem; font-weight: 700; font-stretch: 62%; line-height: 1; }
.mark { width: 18px; flex: none; fill: currentColor; }
.mark .hit { fill: var(--frame-ink-2); }
#info { flex: 1; min-width: 0; font-size: .8125rem; color: var(--frame-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#status { font-size: .8125rem; color: var(--frame-ink-2); }

main { display: grid; grid-template-columns: minmax(340px, 400px) 1fr; min-height: 0; }
.scheme { display: flex; flex-direction: column; min-height: 0; overflow-y: auto; padding: 16px 16px 24px; border-right: 1px solid var(--rule); }
#frame { min-width: 0; min-height: 0; overflow-y: auto; padding: 16px 24px 24px; }
.zone-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 28px; margin-bottom: 16px; }

.seg { display: flex; margin: 0; padding: 0; min-width: 0; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--label); }
.seg label, .seg button { position: relative; display: flex; align-items: center; height: 26px; padding: 0 8px; border: 0; background: none; color: var(--ink-2); cursor: pointer; transition: color 150ms var(--ease); }
.seg label + label, .seg button + button { border-left: 1px solid var(--rule); }
.seg label:first-of-type, .seg button:first-of-type { border-radius: 2px 0 0 2px; }
.seg label:last-of-type, .seg button:last-of-type { border-radius: 0 2px 2px 0; }
.seg label:hover, .seg button:hover { color: var(--ink); }
.seg label:has(:checked), .seg [aria-pressed="true"] { background: var(--frame); color: var(--frame-ink); }
.seg label:has(:focus-visible) { outline: 2px solid var(--live); outline-offset: 2px; z-index: 1; }
.seg input { position: absolute; inset: 0; margin: 0; opacity: 0; pointer-events: none; }

.lbl { display: block; margin-bottom: 6px; color: var(--ink-2); }
.field { display: block; width: 100%; padding: 6px 10px; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); }
textarea.field { resize: none; field-sizing: content; }
.context { min-height: calc(2lh + 14px); max-height: calc(10lh + 14px); }
[aria-invalid="true"] { border-color: var(--error); }

.strips { list-style: none; padding: 0; margin: 16px 0 12px; display: grid; gap: 12px; }
.strip { display: grid; gap: 8px; padding: 12px; background: var(--label); border: 1px solid var(--rule); border-radius: 3px; }
.strip .row { display: flex; align-items: center; gap: 8px; }
.q-name { flex: 1; min-width: 0; height: 28px; padding: 0 8px; background: var(--label); border: 1px solid var(--rule); border-radius: 2px; }
.q-text { height: 36px; }
.q-lines {
  font-size: 14px; line-height: 1.6; min-height: calc(2lh + 14px); max-height: calc(12lh + 14px);
  background-image: repeating-linear-gradient(to bottom, transparent 0 calc(1.6em - 1px), var(--rule) calc(1.6em - 1px) 1.6em);
  background-attachment: local; background-origin: content-box; background-repeat: no-repeat;
}
.del, .tool { color: var(--ink-2); }
.del:hover, .tool:hover { color: var(--ink); background: var(--panel); }
.cap { display: flex; justify-content: space-between; gap: 8px; font-size: .8125rem; color: var(--ink-2); }
.field-error { display: flex; align-items: flex-start; gap: 6px; font-size: .8125rem; color: var(--error); }
.field-error .icon { margin-top: 2px; }
.wide { width: 100%; }
.foot { margin-top: 12px; font-size: .8125rem; color: var(--ink-2); }
#scheme-json { flex: 1; display: flex; flex-direction: column; gap: 8px; }
#json {
  flex: 1; width: 100%; min-height: 20lh; padding: 10px 12px; resize: none; white-space: pre; tab-size: 2;
  font: 13px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
  background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius);
}

.tabs { display: flex; gap: 6px; }
.tab { cursor: pointer; background: none; color: var(--ink-2); transition: color 150ms var(--ease); }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--label); color: var(--ink); }
.sortby { display: flex; align-items: center; gap: 8px; color: var(--ink-2); }
.sortby select { height: 28px; padding: 0 8px; color: var(--ink); background: var(--label); border: 1px solid var(--rule); border-radius: var(--radius); font: inherit; text-transform: inherit; }

.intake {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 24px;
  padding: 20px 24px; background: var(--panel); border: 1px solid var(--rule); border-top: 6px solid var(--frame); border-radius: 4px;
}
.intake h2 { font-size: 1.35rem; font-weight: 600; line-height: 1.25; }
.intake p { margin-top: 4px; color: var(--ink-2); }
.intake-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.quiet { margin-top: 16px; color: var(--ink-2); }

.case {
  margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1px; background: var(--frame); border: 6px solid var(--frame); border-radius: 4px;
}
.bin { display: grid; grid-template-rows: subgrid; grid-row: span 2; row-gap: 0; min-width: 0; }
.bin-label { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-content: start; gap: 2px 8px; padding: 8px 10px; background: var(--label); border-bottom: 1px solid var(--rule); }
.bin-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lvl { font-weight: 500; color: var(--ink-2); }
.count { text-align: right; }
.bin-desc { grid-column: 1 / -1; font-size: .75rem; line-height: 1.4; color: var(--ink-2); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
.bin-interior { min-height: 120px; background: var(--panel); }
.returned .bin-name { display: flex; align-items: center; gap: 6px; }
.returned .bin-name, .returned .count { color: var(--error); }
.count.flash { animation: flash 600ms var(--ease); }
@keyframes flash { 0%, 50% { color: var(--live); } }

#frame .zone-head { flex-wrap: wrap; }
.stale { margin-left: auto; font-size: .8125rem; color: var(--ink-2); }
body.dragging #frame { outline: 2px solid var(--live); outline-offset: -2px; }
.banner { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; padding: 4px 4px 4px 12px; font-size: .8125rem; color: var(--error); background: var(--label); border: 1px solid var(--rule); border-radius: var(--radius); }
.banner span { flex: 1; min-width: 0; }

.intake.filled { display: block; padding: 0; border-bottom: 0; overflow: hidden; }
.intake-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px 10px 16px; }
.intake-bar h2 { flex: 1 1 auto; font-size: 1.125rem; margin-right: 8px; }
.unsorted { border-top: 1px solid var(--rule); }
.tray-head { display: flex; gap: 8px; padding: 8px 16px 0; color: var(--ink-2); }
.tray { max-height: 240px; overflow-y: auto; }
.axis { height: 3px; background: var(--rule); }
.axis::before { content: ""; display: block; height: 100%; width: calc(var(--p, 0) * 100%); background: var(--ink); transition: width 250ms var(--ease); }
.intake.running .axis::before { background: var(--live); }

.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); align-content: start; gap: 6px; padding: 8px; }
.thumb { display: flex; flex-direction: column; gap: 4px; min-width: 0; padding: 0; border: 0; border-radius: 2px; background: none; cursor: pointer; }
.thumb img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 2px; background: var(--rule); }
.thumb:hover img { outline: 1px solid var(--ink-2); outline-offset: 1px; }
.thumb[data-status=running] img { outline: 2px solid var(--live); outline-offset: 1px; }
.thumb:not([data-status=done]) .gauge { visibility: hidden; }

.manifest { flex: 1; margin-top: 16px; overflow: auto; background: var(--label); border: 1px solid var(--rule); border-radius: 4px; }
.manifest table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .8125rem; }
.manifest th, .manifest td { padding: 8px 12px; text-align: left; vertical-align: middle; white-space: nowrap; border-bottom: 1px solid var(--rule); }
.manifest thead th { position: sticky; top: 0; z-index: 1; padding-block: 6px; vertical-align: bottom; background: var(--panel); }
.manifest tbody th { font-weight: 400; }
.manifest tbody tr:last-child > * { border-bottom: 0; }
.manifest .num { text-align: right; }
.qt { display: block; font-stretch: 100%; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--ink-2); }
.open { display: flex; align-items: center; gap: 10px; max-width: 280px; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; }
.open img { width: 48px; height: 48px; flex: none; object-fit: cover; border-radius: 2px; background: var(--rule); }
.open span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.open:hover span { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.cell { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 4px 12px; min-width: 156px; }
.cell .gauge { grid-column: 1 / -1; }
.ans { overflow: hidden; text-overflow: ellipsis; }
.dim { color: var(--ink-2); }
.manifest .run { color: var(--live); }
.manifest .err { color: var(--error); white-space: normal; }
.err-line { display: flex; align-items: flex-start; gap: 6px; }
.err-line .icon { margin-top: 1px; }

#docket { width: calc(100% - 32px); max-width: 1100px; padding: 0; color: var(--ink); background: var(--ground); border: 1px solid var(--rule); border-radius: 4px; }
#docket::backdrop { background: color-mix(in oklch, var(--frame) 55%, transparent); }
.docket-head { display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 16px; border-bottom: 1px solid var(--rule); }
.docket-head h2 { flex: 1; min-width: 0; font-size: .9375rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.docket-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 400px); gap: 24px; padding: 16px; }
#docket-img { display: block; width: 100%; height: auto; max-height: 75vh; object-fit: contain; background: var(--panel); border: 1px solid var(--rule); border-radius: 2px; }
.answers { display: grid; align-content: start; gap: 20px; }
.instr { margin: 6px 0 10px; color: var(--ink-2); }
.opts { display: grid; gap: 6px; }
.opt { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) 5ch; align-items: center; gap: 12px; font-size: .8125rem; color: var(--ink-2); }
.opt > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opt .gauge { height: 8px; }
.opt .val { text-align: right; }
.opt.win { color: var(--ink); font-weight: 650; }
.meta { margin-top: 8px; font-size: .8125rem; color: var(--ink-2); }
.docket-foot { display: flex; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid var(--rule); }

:root { view-transition-name: none; }
::view-transition { pointer-events: none; }
::view-transition-group(*) { animation-duration: 200ms; animation-timing-function: var(--ease); }
@media (prefers-reduced-motion: reduce) { .axis::before { transition: none; } }

@media (min-width: 900px) {
  #frame { display: flex; flex-direction: column; }
  #frame-body[data-view=manifest], #frame-body[data-view=manifest] > #view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .manifest { min-height: 160px; }
}
#frame-body[data-view=manifest] .unsorted { display: none; }

@media (max-width: 899px) {
  body { height: auto; min-height: 100dvh; }
  main { grid-template-columns: 1fr; }
  .scheme, #frame { overflow: visible; }
  .scheme { border-right: 0; border-bottom: 1px solid var(--rule); }
  .bar { flex-wrap: wrap; row-gap: 4px; padding: 10px 16px; }
  .wordmark { flex: 1; }
  #sort { order: 1; }
  #info { order: 2; flex: 1 1 200px; white-space: normal; }
  #status, #stop, #export { order: 3; }
  #frame { padding: 16px; }
  .case { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  #json { min-height: 60dvh; }
  .manifest { max-height: 80dvh; }
  .docket-body { grid-template-columns: 1fr; }
}
</style>

<main>

<input type="file" id="pick-images" accept="image/*" multiple hidden>

<script type="module">
const DEFAULT_REQUEST = {
  "state": "Answer using only what is visible in the image.",
  "questions": {
    "kind": {
      "type": "choice",
      "instructions": "What kind of image is this?",
      "criteria": {
        "photo": "A photograph of a real scene",
        "screenshot": "An application or website screenshot",
        "document": "A scanned or photographed document page",
        "chart": "A chart, graph, or diagram"
      }
    },
    "sharpness": {
      "type": "score",
      "instructions": "How sharp is the image?",
      "criteria": [
        "very blurry",
        "somewhat blurry",
        "acceptable",
        "sharp"
      ]
    },
    "person_visible": {
      "type": "noul",
      "instructions": "Is a person visible in the image?"
    }
  }
};
const KEY = 'peekaboolean.scheme';
const SVG = 'http://www.w3.org/2000/svg';
const isMac = /Mac|iPhone|iPad/.test(navigator.platform);
const TYPE_LABEL = { choice: 'Choice', score: 'Score', noul: 'Yes/no' };
const LINES = {
  choice: { label: 'Options, one per line, key: description', placeholder: 'photo: A photograph of a real scene\nscreenshot: An app or website screenshot', max: 255, unit: 'options', hint: 'key: description' },
  score: { label: 'Levels, one per line, lowest first', placeholder: 'very blurry\nsomewhat blurry\nacceptable\nsharp', max: 10, unit: 'levels', hint: 'lowest first' },
  noul: { label: 'Optional wording, yes: … and no: …', placeholder: 'yes: a person is clearly visible\nno: no person anywhere', max: 2, unit: 'wordings', hint: 'optional' },
};

const $ = id => document.getElementById(id);
const stateEl = $('state'), stripsEl = $('strips'), addBtn = $('add'), formPane = $('scheme-form'), jsonPane = $('scheme-json'),
      jsonEl = $('json'), sortByEl = $('sort-by'), frameBody = $('frame-body'), tabs = [...document.querySelectorAll('[role=tab]')];

let scheme = null;
let checking = false;
let jsonView = false, jsonShown = '';
let frameTimer;
const frameState = { view: 'frame', sortBy: null };

function h(tag, props, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props ?? {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else if (k === 'style') {
      if (typeof v === 'string') el.style.cssText = v;
      else for (const [p, x] of Object.entries(v)) p.includes('-') ? el.style.setProperty(p, x) : (el.style[p] = x);
    }
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  el.append(...children.flat(Infinity).filter(c => c != null && c !== false));
  return el;
}

function icon(name) {
  const svg = document.createElementNS(SVG, 'svg'), use = document.createElementNS(SVG, 'use');
  svg.setAttribute('class', 'icon');
  svg.setAttribute('aria-hidden', 'true');
  use.setAttribute('href', `#i-${name}`);
  svg.append(use);
  return svg;
}

function setStatus(text) { $('status').textContent = text; }

const TYPES = ['choice', 'score', 'noul'];

function fromText(s) {  // a value that parses as a JSON object/array is sent structured, like the API allows
  const t = s.trim();
  if (t.startsWith('{') || t.startsWith('[')) {
    try { const v = JSON.parse(t); if (v && typeof v === 'object') return v; } catch {}
  }
  return t;
}
const toText = v => (typeof v === 'string' ? v : JSON.stringify(v));

function splitKey(line) {  // "key: description" -> [key, description]
  const i = line.indexOf(':');
  return i < 0 ? [line.trim(), ''] : [line.slice(0, i).trim(), line.slice(i + 1).trim()];
}

function buildRequest() {
  const errors = [], questions = Object.create(null);
  scheme.questions.forEach((q, index) => {
    const err = (field, message) => errors.push({ index, field, message });
    const name = q.name.trim() || `q${index + 1}`;
    if (Object.hasOwn(questions, name)) err('name', `"${name}" is used twice`);
    if (!q.instructions.trim()) err('instructions', 'Write the question');
    const lines = q.lines.split('\n').map(l => l.trim()).filter(Boolean);
    const out = { ...q.extra, type: q.type, instructions: fromText(q.instructions) };
    if (q.type === 'choice') {
      const criteria = Object.create(null);
      for (const line of lines) {
        const [key, desc] = splitKey(line);
        if (!key) { err('lines', `"${line}" needs an option name before the colon`); continue; }
        if (Object.hasOwn(criteria, key)) err('lines', `Option "${key}" is listed twice`);
        criteria[key] = fromText(desc);
      }
      const n = Object.keys(criteria).length;
      if (n < 2 || n > 255) err('lines', `A choice needs 2 to 255 options, this has ${n}`);
      out.criteria = criteria;
    } else if (q.type === 'score') {
      if (lines.length < 2 || lines.length > 10) err('lines', `A score needs 2 to 10 levels, this has ${lines.length}`);
      out.criteria = lines.map(fromText);
    } else {
      const criteria = Object.create(null), words = { yes: 'true', true: 'true', no: 'false', false: 'false' };
      for (const line of lines) {
        const [key, desc] = splitKey(line);
        const k = Object.hasOwn(words, key.toLowerCase()) && words[key.toLowerCase()];
        if (!k) { err('lines', `Yes/no wording starts with "yes:" or "no:"`); continue; }
        if (desc) criteria[k] = fromText(desc);
      }
      if (Object.keys(criteria).length) out.criteria = criteria;
    }
    questions[name] = out;
  });
  if (!scheme.questions.length) errors.push({ index: -1, field: 'questions', message: 'Add at least one question' });
  return { request: { state: fromText(scheme.state), questions }, errors };
}

function loadRequest(obj) {
  if (!obj || typeof obj !== 'object' || !obj.questions || typeof obj.questions !== 'object' || Array.isArray(obj.questions))
    throw new Error('Expected {"state": …, "questions": {"name": {"type", "instructions", "criteria"}}}');
  const questions = Object.entries(obj.questions).map(([name, q]) => {
    if (!q || !TYPES.includes(q.type)) throw new Error(`Question "${name}" needs "type": "choice", "score" or "noul"`);
    const { type, instructions = '', criteria, ...extra } = q;
    let lines = '';
    if (Array.isArray(criteria)) lines = criteria.map(toText).join('\n');
    else if (criteria && typeof criteria === 'object')
      lines = Object.entries(criteria).map(([k, v]) => {
        const key = type === 'noul' ? ({ true: 'yes', false: 'no' }[k] ?? k) : k;
        const d = toText(v ?? '');
        return d ? `${key}: ${d}` : key;
      }).join('\n');
    return { name, type, instructions: toText(instructions), lines, extra };
  });
  scheme = { state: toText(obj.state ?? ''), questions };
  save();
  renderScheme();
  renderFrame();
}

function bins(question) {
  if (question.type === 'choice')
    return Object.entries(question.criteria ?? {}).map(([key, d]) => ({ key, label: key, description: toText(d) }));
  if (question.type === 'score')
    return (question.criteria ?? []).map((level, i) => ({ key: String(i), label: toText(level), description: `level ${i}` }));
  const c = question.criteria ?? {};
  return [{ key: 'yes', label: 'yes', description: toText(c.true ?? '') },
          { key: 'no', label: 'no', description: toText(c.false ?? '') }];
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(scheme)); } catch {}
}

let uid = 0;
function strip(q) {
  const group = `type-${++uid}`;
  return h('li', { class: 'strip' },
    h('div', { class: 'row' },
      h('input', { class: 'q-name', 'aria-label': 'Question name', value: q.name, autocomplete: 'off', spellcheck: 'false', dataset: { field: 'name' } }),
      h('fieldset', { class: 'seg' },
        h('legend', { class: 'vh' }, 'Type'),
        TYPES.map(t => h('label', null,
          h('input', { type: 'radio', name: group, value: t, checked: q.type === t, dataset: { field: 'type' } }), TYPE_LABEL[t]))),
      h('button', { type: 'button', class: 'btn icon-btn del', dataset: { action: 'delete' } }, icon('trash-2'))),
    h('input', { class: 'field q-text', 'aria-label': 'Question', placeholder: 'What kind of image is this?', value: q.instructions, dataset: { field: 'instructions' } }),
    h('textarea', { class: 'field q-lines', rows: 3, text: q.lines, dataset: { field: 'lines' } }),
    h('p', { class: 'cap' }, h('span', { class: 'cap-n' }), h('span', { class: 'cap-hint' })));
}

function updateStrips() {
  [...stripsEl.children].forEach((li, i) => {
    const q = scheme.questions[i], t = LINES[q.type], lines = li.querySelector('[data-field=lines]');
    li.querySelector('[data-field=name]').placeholder = `q${i + 1}`;
    li.querySelector('.del').setAttribute('aria-label', `Delete question ${q.name.trim() || `q${i + 1}`}`);
    lines.placeholder = t.placeholder;
    lines.setAttribute('aria-label', t.label);
    li.querySelector('.cap-n').textContent = `${q.lines.split('\n').filter(l => l.trim()).length} / ${t.max} ${t.unit}`;
    li.querySelector('.cap-hint').textContent = t.hint;
  });
}

function renderScheme() {
  stateEl.value = scheme.state;
  stripsEl.replaceChildren(...scheme.questions.map(strip));
  updateStrips();
  markErrors(checking ? buildRequest().errors : []);
}

function fieldEl(index, field) {
  return index < 0 ? addBtn : stripsEl.children[index].querySelector(`[data-field=${field}]`);
}

function markErrors(errors) {
  formPane.querySelectorAll('.field-error').forEach(p => p.remove());
  formPane.querySelectorAll('[aria-describedby]').forEach(el => { el.removeAttribute('aria-describedby'); el.removeAttribute('aria-invalid'); });
  for (const { index, field, message } of errors) {
    const el = fieldEl(index, field);
    if (el.hasAttribute('aria-describedby')) continue;
    const id = `err-${index}-${field}`;
    el.setAttribute('aria-describedby', id);
    if (index >= 0) el.setAttribute('aria-invalid', 'true');
    (field === 'name' ? el.parentElement : el).after(h('p', { class: 'field-error', id }, icon('triangle-alert'), message));
  }
}

function edited() {
  save();
  updateStrips();
  if (checking) markErrors(buildRequest().errors);
  clearTimeout(frameTimer);
  frameTimer = setTimeout(renderFrame, 120);
}

stateEl.addEventListener('input', () => { scheme.state = stateEl.value; edited(); });

stripsEl.addEventListener('input', e => {
  const field = e.target.dataset.field;
  if (!field) return;
  scheme.questions[[...stripsEl.children].indexOf(e.target.closest('li'))][field] = e.target.value;
  edited();
});

stripsEl.addEventListener('click', e => {
  const del = e.target.closest('[data-action=delete]');
  if (!del) return;
  const i = [...stripsEl.children].indexOf(del.closest('li'));
  scheme.questions.splice(i, 1);
  renderScheme();
  edited();
  const next = stripsEl.children[i - 1] ?? stripsEl.children[0];
  (next?.querySelector('[data-field=instructions]') ?? addBtn).focus();
});

addBtn.addEventListener('click', () => {
  scheme.questions.push({ name: '', type: 'choice', instructions: '', lines: '', extra: {} });
  renderScheme();
  edited();
  stripsEl.lastElementChild.querySelector('[data-field=instructions]').focus();
});

function showJsonError(message) {
  jsonPane.querySelector('.field-error')?.remove();
  if (!message) { jsonEl.removeAttribute('aria-invalid'); jsonEl.removeAttribute('aria-describedby'); return; }
  jsonEl.setAttribute('aria-invalid', 'true');
  jsonEl.setAttribute('aria-describedby', 'json-error');
  jsonEl.after(h('p', { class: 'field-error', id: 'json-error' }, icon('triangle-alert'), message));
}

function applyJson(report) {
  const text = jsonEl.value;
  if (text !== jsonShown) {
    try { loadRequest(JSON.parse(text)); }
    catch (e) {
      if (report || jsonEl.hasAttribute('aria-invalid')) showJsonError(e instanceof SyntaxError ? `Not valid JSON: ${e.message}` : e.message);
      return false;
    }
    jsonShown = text;
  }
  showJsonError(null);
  return true;
}

function setView(json) {
  if (json === jsonView) return true;
  if (!json && !applyJson(true)) { jsonEl.focus(); return false; }
  if (json) jsonEl.value = jsonShown = JSON.stringify(buildRequest().request, null, 2);
  jsonView = json;
  formPane.hidden = json;
  jsonPane.hidden = !json;
  $('view-form').setAttribute('aria-pressed', !json);
  $('view-json').setAttribute('aria-pressed', json);
  return true;
}

$('view-form').addEventListener('click', () => setView(false));
$('view-json').addEventListener('click', () => setView(true));
jsonEl.addEventListener('input', () => applyJson(false));

function requestSort() {
  if (jsonView && !applyJson(true)) { jsonEl.focus(); return; }
  const { request, errors } = buildRequest();
  checking = errors.length > 0;
  if (checking) setView(false);
  markErrors(errors);
  if (checking) { fieldEl(errors[0].index, errors[0].field).focus(); return; }
  document.dispatchEvent(new CustomEvent('sort', { detail: request }));
}

$('sort').addEventListener('click', requestSort);
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !(e.metaKey || e.ctrlKey) || e.isComposing) return;
  e.preventDefault();
  if (!e.repeat) requestSort();
});

const IMAGE = /\.(jpe?g|png|webp|gif|bmp|tiff?)$/i;
const frameBanner = $('frame-banner'), schemeBanner = $('scheme-banner'), intakeEl = $('intake'), viewEl = $('view'), docket = $('docket');
const axisEl = h('div', { class: 'axis' }), trayEl = h('div', { class: 'thumbs tray' }), trayCount = h('span', { class: 'count' });
const unsortedEl = h('div', { class: 'unsorted' }, h('p', { class: 'tray-head' }, 'Unsorted', trayCount), trayEl);
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
const unbroken = e => e.target.removeAttribute('src');

let images = [];
let nextId = 0, pasted = 0, dragDepth = 0;
let run = null;          // { stop: boolean } while sorting
let sortedRequest = null; // the typed request the current results belong to
let docketImg = null, opener = null, copyTimer;

function banner(message, host = frameBanner) {
  host.replaceChildren(h('div', { class: 'banner', role: 'alert' }, icon('triangle-alert'), h('span', null, message),
    h('button', { type: 'button', class: 'btn icon-btn tool', 'aria-label': 'Dismiss', onclick: () => host.replaceChildren() }, icon('x'))));
}

function record(file, path) {
  const img = { id: ++nextId, file, path, url: URL.createObjectURL(file), status: 'pending', result: null, error: null, thumb: null };
  img.thumb = h('button', { type: 'button', class: 'thumb', title: path, onclick: () => openDocket(img) },
    h('img', { alt: '', loading: 'lazy', decoding: 'async', src: img.url, onerror: unbroken }),
    h('span', { class: 'gauge win' }));
  return img;
}

function addFiles(list) {
  const seen = new Set(images.map(i => `${i.path}|${i.file.size}|${i.file.lastModified}`));
  let added = 0, skipped = 0;
  for (const { file, path } of list) {
    const parts = path.split('/');
    if (!IMAGE.test(parts.at(-1)) || parts.some(p => p.startsWith('.'))) { skipped++; continue; }
    const key = `${path}|${file.size}|${file.lastModified}`;
    if (seen.has(key)) continue;
    seen.add(key);
    images.push(record(file, path));
    added++;
  }
  images.sort((a, b) => a.path.localeCompare(b.path, undefined, { numeric: true, sensitivity: 'base' }));
  setStatus(`Added ${plural(added, 'image')}${skipped ? ` · skipped ${plural(skipped, 'other file')}` : ''}`);
  renderAll();
}

function clear() {
  for (const img of images) URL.revokeObjectURL(img.url);
  images = [];
  sortedRequest = null;
  setStatus('');
  renderAll();
  $('choose-folder').focus();
}

function filesFromDrop(dataTransfer) {  // must be called synchronously inside the drop handler
  const entries = [...dataTransfer.items].map(item => item.webkitGetAsEntry?.()).filter(Boolean);
  const out = [];
  const walk = async entry => {
    if (entry.isFile) {
      const file = await new Promise((resolve, reject) => entry.file(resolve, reject));
      out.push({ file, path: entry.fullPath.replace(/^\//, '') });
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      for (;;) {  // readEntries hands out at most ~100 entries per call; an empty batch means done
        const batch = await new Promise((resolve, reject) => reader.readEntries(resolve, reject));
        if (!batch.length) break;
        for (const child of batch) await walk(child);
      }
    }
  };
  return (async () => { for (const entry of entries) await walk(entry); return out; })();
}

async function loadJsonFile(file) {
  try {
    loadRequest(JSON.parse(await file.text()));
    schemeBanner.replaceChildren();
    if (jsonView) { jsonEl.value = jsonShown = JSON.stringify(buildRequest().request, null, 2); showJsonError(null); }
  } catch (e) {
    banner(`Could not load ${file.name}: ${e instanceof SyntaxError ? `not valid JSON (${e.message})` : e.message}`, schemeBanner);
  }
}

function setDragging(on) {
  document.body.classList.toggle('dragging', on);
  const heading = intakeEl.querySelector('h2');
  heading.textContent = on ? 'Release to add' : heading.dataset.text;
}

const dragsFiles = e => e.dataTransfer?.types.includes('Files');
addEventListener('dragenter', e => { if (dragsFiles(e) && dragDepth++ === 0) setDragging(true); });
addEventListener('dragleave', e => {
  if (!dragsFiles(e) || !dragDepth) return;
  if (--dragDepth === 0) setDragging(false);
});
addEventListener('dragover', e => { if (dragsFiles(e)) e.preventDefault(); });
addEventListener('drop', e => {
  if (!dragsFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  setDragging(false);
  const files = [...e.dataTransfer.files];
  if (files.length === 1 && /\.json$/i.test(files[0].name)) return loadJsonFile(files[0]);
  filesFromDrop(e.dataTransfer).then(addFiles, err => banner(`Could not read the dropped files: ${err.message}`));
});

document.addEventListener('paste', e => {
  const files = [...(e.clipboardData?.files ?? [])].filter(f => f.type.startsWith('image/'));
  if (!files.length) return;
  e.preventDefault();
  addFiles(files.map(file => ({ file, path: `pasted-${++pasted}.${file.type.slice(6)}` })));
});

$('pick-folder').addEventListener('change', e => {
  addFiles([...e.target.files].map(file => ({ file, path: file.webkitRelativePath || file.name })));
  e.target.value = '';
});
$('pick-images').addEventListener('change', e => {
  addFiles([...e.target.files].map(file => ({ file, path: file.name })));
  e.target.value = '';
});
intakeEl.addEventListener('click', e => {
  const action = e.target.closest('[data-action]')?.dataset.action;
  if (action === 'folder') $('pick-folder').click();
  else if (action === 'images') $('pick-images').click();
  else if (action === 'clear') clear();
});

function move(parent, node, before) {
  const focused = document.activeElement === node;
  parent.insertBefore(node, before);
  if (focused) node.focus({ preventScroll: true });
}

function fill(el, list) {
  const want = new Set(list.map(i => i.thumb));
  for (const child of [...el.children]) if (!want.has(child)) child.remove();
  list.forEach((img, i) => { if (el.children[i] !== img.thumb) move(el, img.thumb, el.children[i] ?? null); });
}

function renderIntake() {
  const focused = document.activeElement?.closest?.('#intake [data-action]')?.dataset.action;
  const heading = text => h('h2', { dataset: { text } }, dragDepth ? 'Release to add' : text);
  const pick = (action, name, label, id) => h('button', { type: 'button', class: 'btn secondary', id, dataset: { action } }, icon(name), label);
  intakeEl.className = images.length ? 'intake filled' : 'intake';
  if (!images.length) intakeEl.replaceChildren(
    h('div', null,
      heading('Drop a folder or images'),
      h('p', null, `or paste with ${isMac ? '⌘V' : 'Ctrl+V'} · JPEG, PNG, WebP, GIF, BMP, TIFF · nothing leaves this machine`)),
    h('div', { class: 'intake-actions' },
      pick('folder', 'folder-open', 'Choose folder', 'choose-folder'), pick('images', 'images', 'Choose images', 'choose-images')));
  else intakeEl.replaceChildren(
    h('div', { class: 'intake-bar' },
      heading(plural(images.length, 'image')),
      pick('folder', 'folder-open', 'Add folder'), pick('images', 'images', 'Add images'),
      h('button', { type: 'button', class: 'btn secondary', dataset: { action: 'clear' }, disabled: !!run }, icon('x'), 'Clear')),
    unsortedEl, axisEl);
  renderTray();
  if (focused) intakeEl.querySelector(`[data-action=${focused}]`)?.focus();
}

function renderTray() {
  const list = images.filter(i => i.status === 'pending' || i.status === 'running');
  fill(trayEl, list);
  list.forEach(updateThumb);
  trayCount.textContent = list.length;
  unsortedEl.hidden = !list.length;
}

function summary() {
  const finished = images.filter(i => i.status === 'done' || i.status === 'error');
  const secs = finished.filter(i => i.result).map(i => i.result.usage?.seconds ?? 0);
  const avg = secs.length ? ` · ${Math.round(secs.reduce((a, b) => a + b, 0) / secs.length * 1000)} ms each` : '';
  if (run) return `Sorting ${finished.length} / ${images.length}${avg}`;
  const of = finished.length < images.length ? ` / ${images.length}` : '';
  return `Sorted ${finished.length}${of} · ${finished.length - secs.length} returned${avg}`;
}

function progress() {
  const finished = images.filter(i => i.status === 'done' || i.status === 'error').length;
  axisEl.style.setProperty('--p', images.length ? finished / images.length : 0);
  intakeEl.classList.toggle('running', !!run);
  $('export').disabled = !images.some(i => i.result);
  if (run) setStatus(summary());
}

function setRunning(on) {
  const sortBtn = $('sort'), stopBtn = $('stop'), active = document.activeElement;
  sortBtn.disabled = on;
  sortBtn.querySelector('span').textContent = on ? 'Sorting…' : 'Sort';
  stopBtn.hidden = !on;
  stopBtn.querySelector('span').textContent = 'Stop';
  if (on && active === sortBtn) stopBtn.focus();
  if (!on && active === stopBtn) sortBtn.focus();
  progress();
  setStatus(summary());
}

async function runSort(request) {
  if (run || !images.length) return;
  run = { stop: false };
  sortedRequest = request;
  frameBanner.replaceChildren();
  for (const img of images) Object.assign(img, { status: 'pending', result: null, error: null });
  setRunning(true);
  renderAll();
  for (const img of [...images]) {
    if (run.stop) break;
    img.status = 'running';
    updateItem(img);
    let image;
    try { image = await base64(img.file); }
    catch (e) { Object.assign(img, { status: 'error', error: `Could not read the file: ${e.message}` }); placeItem(img); continue; }
    let res, body;
    try {
      res = await fetch('/api/answer', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                         body: JSON.stringify({ ...request, image }) });
      body = await res.json().catch(() => ({ error: `HTTP ${res.status}`, scope: 'server' }));
    } catch (e) {
      img.status = 'pending';
      banner(`Lost the server (${e.message}). Is peekaboolean.ui still running?`);
      break;
    }
    if (res.ok) Object.assign(img, { status: 'done', result: body });
    else if (body.scope === 'request') { img.status = 'pending'; banner(`The model rejected the request: ${body.error}`); break; }
    else Object.assign(img, { status: 'error', error: body.error });
    placeItem(img);
  }
  run = null;
  setRunning(false);
  renderAll();
}

function base64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.slice(reader.result.indexOf(',') + 1));
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

document.addEventListener('sort', e => {
  if (!images.length) { setStatus('Add images first'); $('choose-folder').focus(); return; }
  runSort(e.detail);
});
$('stop').addEventListener('click', () => {
  if (!run) return;
  run.stop = true;
  $('stop').querySelector('span').textContent = 'Stopping…';
});

function binOf(question, answer) {
  if (!answer) return null;
  if (answer.type === 'choice') return answer.choice;
  if (answer.type === 'score') return String(Math.min(question.criteria.length - 1, Math.max(0, Math.round(answer.score))));
  return answer.noul >= 0.5 ? 'yes' : 'no';
}

function strength(answer, key) {  // probability of the bin the image landed in
  if (answer.type === 'noul') return key === 'yes' ? answer.noul : 1 - answer.noul;
  return answer.probabilities[key];
}

function withTransition(fn) {
  // ponytail: one view-transition name per thumb; above ~400 images the snapshot cost outweighs the motion, so it is skipped
  if (!document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches || images.length > 400) return fn();
  document.startViewTransition(fn).ready.catch(() => {});
}

function nameThumbs(moving) {
  const on = new Set(moving);
  for (const img of images) img.thumb.style.viewTransitionName = on.has(img) ? `t${img.id}` : 'none';
}

function flash(el) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
}

function members(q, name, key) {
  if (key == null) return images.filter(i => i.status === 'error');
  return images.filter(i => i.status === 'done' && binOf(q, i.result.answers?.[name]) === key)
    .sort((a, b) => strength(b.result.answers[name], key) - strength(a.result.answers[name], key));
}

function updateThumb(img) {
  const t = img.thumb, name = frameState.sortBy, q = sortedRequest?.questions[name];
  let label = img.path;
  t.dataset.status = img.status;
  if (img.status === 'running') label += ': sorting';
  else if (img.status === 'error') label += `: ${img.error}`;
  else if (img.status === 'done' && q && img.result.answers?.[name]) {
    const a = img.result.answers[name], key = binOf(q, a), s = strength(a, key);
    t.style.setProperty('--p', s);
    label += `: ${bins(q).find(b => b.key === key)?.label ?? key} ${Math.round(s * 100)}%`;
  }
  t.setAttribute('aria-label', label);
}

function binEl(q, b, list) {
  const el = h('div', { class: b ? 'bin' : 'bin returned', dataset: b && { key: b.key } },
    h('div', { class: 'bin-label' },
      b ? h('span', { class: 'bin-name', title: b.label }, q.type === 'score' ? [h('span', { class: 'lvl' }, `L${b.key}`), ' ', b.label] : b.label)
        : h('span', { class: 'bin-name' }, icon('triangle-alert'), 'Return to sender'),
      h('span', { class: 'count' }),
      b && q.type !== 'score' && b.description ? h('p', { class: 'bin-desc', title: b.description }, b.description) : null),
    h('div', { class: 'bin-interior thumbs' }));
  fillBin(el, list);
  return el;
}

function fillBin(el, list) {
  fill(el.lastElementChild, list);
  list.forEach(updateThumb);
  el.querySelector('.count').textContent = list.length;
}

function caseView(q, name) {
  const list = q ? bins(q) : [];
  if (!list.length) return h('p', { class: 'quiet' }, q ? 'Add options to see the bins' : 'Add a question to see the bins');
  const returned = members(q, name, null);
  return h('div', { class: 'case' }, list.map(b => binEl(q, b, members(q, name, b.key))), returned.length ? binEl(q, null, returned) : null);
}

function answerCell(q, a) {
  if (!a) return h('td', { class: 'dim' }, '—');
  const key = binOf(q, a), label = bins(q).find(b => b.key === key)?.label ?? key;
  let value, gauge;
  if (a.type === 'score') {
    const top = Math.max(1, q.criteria.length - 1);
    value = `${a.score.toFixed(2)} / ${top}`;
    gauge = h('span', { class: 'gauge marker', style: { '--p': a.score / top } });
  } else {
    const p = a.type === 'choice' ? a.probabilities[a.choice] : a.noul;
    value = p.toFixed(2);
    gauge = h('span', { class: a.type === 'choice' || key === 'yes' ? 'gauge win' : 'gauge', style: { '--p': p } });
  }
  return h('td', null, h('div', { class: 'cell' }, h('span', { class: 'ans', title: label }, label), h('span', null, value), gauge));
}

function cells(img, req, names) {
  const ms = img.result ? h('td', { class: 'num' }, String(Math.round((img.result.usage?.seconds ?? 0) * 1000))) : h('td', { class: 'num dim' }, '—');
  if (img.status === 'error')
    return [h('td', { class: 'err', colspan: names.length || 1 }, h('span', { class: 'err-line' }, icon('triangle-alert'), img.error)), ms];
  if (img.status === 'running') return [h('td', { class: 'run', colspan: names.length || 1 }, 'sorting…'), ms];
  if (!img.result) return [...names.map(() => h('td', { class: 'dim' }, '—')), ms];
  return [...names.map(n => answerCell(req.questions[n], img.result.answers?.[n])), ms];
}

function manifest(req, names) {
  if (!images.length) return h('p', { class: 'quiet' }, 'Nothing sorted yet');
  return h('div', { class: 'manifest' }, h('table', null,
    h('thead', null, h('tr', null,
      h('th', { scope: 'col' }, 'Image'),
      names.map(n => h('th', { scope: 'col' }, n, h('span', { class: 'qt' }, TYPE_LABEL[req.questions[n].type]))),
      h('th', { scope: 'col', class: 'num' }, 'ms'))),
    h('tbody', null, images.map(img => (img.row = h('tr', null,
      h('th', { scope: 'row' }, h('button', { type: 'button', class: 'open', title: img.path, onclick: () => openDocket(img, true) },
        h('img', { alt: '', loading: 'lazy', decoding: 'async', src: img.url, onerror: unbroken }), h('span', null, img.path))),
      cells(img, req, names)))))));
}

function updateRow(img) {
  const row = img.row;
  if (frameState.view !== 'manifest' || !row?.isConnected) return;
  const req = sortedRequest ?? buildRequest().request;
  while (row.children.length > 1) row.lastElementChild.remove();
  row.append(...cells(img, req, Object.keys(req.questions)));
}

function updateItem(img) {
  updateThumb(img);
  updateRow(img);
  progress();
}

function placeItem(img) {
  updateItem(img);
  if (docket.open && docketImg === img) fillDocket(img);
  const name = frameState.sortBy, q = sortedRequest?.questions[name];
  if (frameState.view !== 'frame' || !q) { img.thumb.remove(); renderTray(); return; }
  const key = img.status === 'done' ? binOf(q, img.result.answers?.[name]) : null;
  const list = members(q, name, key);
  nameThumbs(list.slice(list.indexOf(img)));
  withTransition(() => {
    const caseEl = viewEl.querySelector('.case');
    let bin = caseEl && [...caseEl.children].find(b => (key == null ? b.classList.contains('returned') : b.dataset.key === key));
    if (caseEl && !bin && key == null) caseEl.append(bin = binEl(q, null, []));
    if (bin) { fillBin(bin, members(q, name, key)); flash(bin.querySelector('.count')); }
    renderTray();
  });
}

function renderFrame() {
  const current = buildRequest().request, req = sortedRequest ?? current;
  const names = Object.keys(req.questions);
  if (!names.includes(frameState.sortBy)) frameState.sortBy = names[0] ?? null;
  sortByEl.replaceChildren(...names.map(n => h('option', { value: n, selected: n === frameState.sortBy }, n)));
  $('sort-by-label').hidden = frameState.view !== 'frame' || !names.length;
  $('stale').hidden = !sortedRequest || JSON.stringify(current) === JSON.stringify(sortedRequest);
  frameBody.dataset.view = frameState.view;
  viewEl.replaceChildren(frameState.view === 'frame' ? caseView(req.questions[frameState.sortBy], frameState.sortBy) : manifest(req, names));
}

function renderAll() {
  renderIntake();
  renderFrame();
  progress();
}

sortByEl.addEventListener('change', () => {
  frameState.sortBy = sortByEl.value;
  nameThumbs(images.filter(i => i.status === 'done' || i.status === 'error'));
  withTransition(renderFrame);
});

function answersFor(img) {
  if (img.status === 'error') return [h('p', { class: 'field-error' }, icon('triangle-alert'), img.error)];
  if (!img.result) return [h('p', { class: 'dim' }, img.status === 'running' ? 'Sorting…' : 'Not sorted yet')];
  const req = sortedRequest;
  return Object.entries(req.questions).map(([name, q]) => {
    const a = img.result.answers?.[name];
    if (!a) return null;
    const win = binOf(q, a);
    const meta = a.type === 'score' ? `expected ${a.score.toFixed(2)} of ${q.criteria.length - 1} · confidence ${a.confidence.toFixed(3)}`
      : a.type === 'choice' ? `confidence ${a.confidence.toFixed(3)}` : null;
    return h('section', null,
      h('h3', { class: 'plate' }, name),
      h('p', { class: 'instr' }, toText(q.instructions)),
      h('div', { class: 'opts' }, bins(q).map(b => {
        const p = strength(a, b.key) ?? 0;
        return h('div', { class: b.key === win ? 'opt win' : 'opt' },
          h('span', { title: b.label }, b.label),
          h('span', { class: b.key === win ? 'gauge win' : 'gauge', style: { '--p': p } }),
          h('span', { class: 'val' }, p.toFixed(3)));
      })),
      meta && h('p', { class: 'meta' }, meta));
  });
}

function fillDocket(img) {
  const copy = $('docket-copy');
  docketImg = img;
  $('docket-path').textContent = img.path;
  $('docket-img').src = img.url;
  $('docket-answers').replaceChildren(...answersFor(img));
  clearTimeout(copyTimer);
  copy.querySelector('span').textContent = 'Copy JSON';
  copy.disabled = !img.result;
}

function openDocket(img, fromRow = false) {
  opener = { img, fromRow };
  fillDocket(img);
  if (!docket.open) docket.showModal();
}

const step = d => fillDocket(images[(images.indexOf(docketImg) + d + images.length) % images.length]);
$('docket-prev').addEventListener('click', () => step(-1));
$('docket-next').addEventListener('click', () => step(1));
$('docket-close').addEventListener('click', () => docket.close());
$('docket-img').addEventListener('error', unbroken);
docket.addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault();
  step(e.key === 'ArrowLeft' ? -1 : 1);
});
docket.addEventListener('close', () => {
  const el = opener?.fromRow ? opener.img.row?.querySelector('.open') : opener?.img.thumb;
  if (el?.isConnected) el.focus();
});
$('docket-copy').addEventListener('click', () => {
  const label = $('docket-copy').querySelector('span');
  const say = text => {
    label.textContent = text;
    clearTimeout(copyTimer);
    copyTimer = setTimeout(() => { label.textContent = 'Copy JSON'; }, 1500);
  };
  navigator.clipboard.writeText(JSON.stringify(docketImg.result, null, 2)).then(() => say('Copied'), () => say('Copy failed'));
});

$('export').addEventListener('click', () => {
  const results = {}, errors = {};
  for (const img of images) {
    if (img.result) results[img.path] = img.result;
    else if (img.error) errors[img.path] = img.error;
  }
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const blob = new Blob([JSON.stringify({ request: sortedRequest, results, errors }, null, 2)], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(blob),
    download: `peekaboolean-${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json` });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href));
});

function selectTab(tab) {
  for (const t of tabs) {
    const on = t === tab;
    t.setAttribute('aria-selected', on);
    t.tabIndex = on ? 0 : -1;
    if (on) t.id = 'frame-h'; else t.removeAttribute('id');
  }
  frameState.view = tab.dataset.view;
  renderFrame();
}
tabs.forEach(t => t.addEventListener('click', () => selectTab(t)));
tabs[0].parentElement.addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const t = tabs[1 - tabs.indexOf(e.target)];
  selectTab(t);
  t.focus();
});

if (!isMac) $('sort').querySelector('kbd').textContent = 'Ctrl↵';

fetch('/api/info')
  .then(r => (r.ok ? r.json() : Promise.reject()))
  .then(i => { $('info').textContent = `${i.model.split('/').pop()} · ${i.adapter} · ${i.device} · ${i.max_edge} px`; })
  .catch(() => { $('info').textContent = 'server not reachable'; });

try {
  const stored = JSON.parse(localStorage.getItem(KEY));
  if (typeof stored?.state === 'string' && Array.isArray(stored.questions) && stored.questions.every(q =>
      TYPES.includes(q?.type) && ['name', 'instructions', 'lines'].every(f => typeof q[f] === 'string'))) { scheme = stored; buildRequest(); }
} catch { scheme = null; }
renderIntake();
if (scheme) { renderScheme(); renderFrame(); } else loadRequest(DEFAULT_REQUEST);
</script>
</body>
</html>
